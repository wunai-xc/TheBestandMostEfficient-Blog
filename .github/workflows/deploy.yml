name: Deploy to Cloudflare Pages

# 仅手动触发：推 main 不再跑本工作流。
# Cloudflare Pages 自己的 Git 集成已在 push 时部署，两者重复；而且本工作流最后一步
# （wrangler pages deploy）会报失败，却又不影响实际发布，只会给出误导性的红灯。
# 需要时在仓库 Actions 页面「Run workflow」手动跑一次。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Install dependencies
        working-directory: my-app
        run: npm ci

      - name: Build
        working-directory: my-app
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=wunai-blog
          workingDirectory: my-app
